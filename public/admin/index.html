<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230F3D3A%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2738%27 text-anchor=%27middle%27 fill=%27%23E9B73A%27 font-family=%27Georgia,serif%27 font-weight=%27700%27%3ET%3C/text%3E%3C/svg%3E">
<title>Portfolio admin</title>
<style>
:root{--bg:#F2F5F3;--surface:#fff;--ink:#10201E;--ink2:#4A5D5A;--line:#CBD8D4;--deep:#0F3D3A;--trace:#1B6B62;--gold:#E9B73A;--tag:#E6EEEB;--warn:rgba(217,162,27,.2);--danger:#B3261E;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1614;--surface:#12231F;--ink:#E5EFEC;--ink2:#9DB3AE;--line:#25403B;--deep:#1F6F66;--trace:#5FC4B5;--tag:#1A2E2A;--warn:rgba(233,183,58,.2);--danger:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:var(--gold);color:#1B1500;box-shadow:0 3px 0 #A97C0E}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--surface);color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
a.btn{text-decoration:none}
.sm{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.sm:hover{border-color:var(--trace);color:var(--trace)}
.sm.danger{color:var(--danger)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:16px;box-shadow:0 20px 40px -24px rgba(0,0,0,.4)}
.lbox h1{font-size:1.6rem}
.lbox p{color:var(--ink2);margin:0}
.lbox input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.err{color:var(--danger);font-weight:600;min-height:1.3em;margin:0}

/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:1.1rem;margin-right:auto}
.status{font-size:.9rem;color:var(--ink2)}
.status.dirty{color:var(--danger);font-weight:600}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
#side{padding:16px 12px;border-right:1px solid var(--line);position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto;display:grid;gap:4px}
#side button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--ink2)}
#side button:hover{background:var(--tag)}
#side button.on{background:var(--deep);color:#fff}
#side b{font-size:.75rem;min-width:22px;text-align:center;padding:2px 7px;border-radius:999px;background:var(--gold);color:#1B1500}
#side hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
main{padding:24px clamp(16px,4vw,40px) 80px;max-width:960px;width:100%}
main h2{font-size:1.6rem;margin-bottom:6px}
.lead{color:var(--ink2);margin:0 0 22px}

/* forms */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.f{display:grid;gap:5px;align-content:start;min-width:0}
.f.wide{grid-column:1/-1}
.f>label{font-weight:600;font-size:.9rem}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.f textarea{min-height:92px;resize:vertical}
.f .ph{border-color:var(--gold)!important;background:var(--warn)!important}
.hint{font-size:.82rem;color:var(--ink2)}
.hint.ph{padding:4px 8px;border-radius:6px;border:1px dashed var(--gold)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
legend{font-weight:600;padding:0 6px}
.media{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.media img{width:96px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.media .nm{font-size:.82rem;color:var(--ink2);word-break:break-all;max-width:260px}

/* list cards */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.hasph{border-left:5px solid var(--gold)}
.chead{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px 8px 14px}
.ctitle{flex:1 1 220px;text-align:left;background:none;border:0;padding:8px 0;font-weight:700;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:6px 16px 18px;border-top:1px solid var(--line)}
.cbody>.fields{margin-top:14px}
.addrow{margin-top:14px}
.empty{padding:24px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink2)}

/* drag, switch, tips */
.drag{flex:none;width:22px;height:30px;margin-right:2px;cursor:grab;touch-action:none;user-select:none;background:radial-gradient(circle,var(--ink2) 1.7px,transparent 2.2px) 0 0/8px 8px;opacity:.7;border-radius:4px}
.drag:hover{opacity:1}
.card.dragging{opacity:.55;box-shadow:0 16px 30px -12px rgba(0,0,0,.5);outline:2px dashed var(--gold)}
.card.off .ctitle{opacity:.55;text-decoration:line-through}
.card.off{background:var(--bg)}
.sw{min-height:36px;min-width:58px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.85rem;color:var(--ink2)}
.sw.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.sm.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.tip{background:var(--warn);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.range2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range2 label{display:grid;gap:4px;font-weight:500;font-size:.85rem}
.range2 input[type=month]{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
#side button.dim span{opacity:.5;text-decoration:line-through}
#side b.n{background:var(--trace);color:#fff}
.help{font-size:.9rem;color:var(--ink2);margin:0 0 14px}
.empty ol{margin:8px 0 0;padding-left:20px}

.linkrow{display:flex;gap:10px;flex-wrap:wrap}
.linkbox{flex:1 1 260px;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:ui-monospace,Consolas,monospace;font-size:.9rem;color:var(--ink)}
.vtitle{flex:1 1 220px;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:4px 0}
.vbody{padding:12px 16px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.vbody pre{white-space:pre-wrap;font:inherit;margin:0;padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.vbody textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);resize:vertical}
.vbody .btn{justify-self:start}
.vrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.vsel{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}
.vsel select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.vlist .card.off .vtitle strong{opacity:.6}

.pgh{margin:18px 0 8px;font-size:1rem}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prow{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow.on{border-color:var(--trace);background:var(--tag)}
.pchk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;min-width:0}
.pchk input{width:18px;height:18px;flex:none}
.pchk .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow input[type=text]{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);min-width:0}
.pbadge{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;font:800 .68rem/1 var(--body,system-ui);flex:none}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr}.prow{grid-template-columns:1fr}}

/* inbox, history, media */
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row .grow{flex:1;min-width:220px}
.row .meta{color:var(--ink2);font-size:.88rem}
.row pre{white-space:pre-wrap;font:inherit;margin:8px 0}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.tag2{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tag);color:var(--trace);margin-right:8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.mcard img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#fff}
.mcard .pdf{height:110px;display:grid;place-items:center;background:var(--tag);border-radius:8px;font-weight:700}
.mcard small{color:var(--ink2);word-break:break-all}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--danger);color:#fff}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  #side{position:static;max-height:none;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  #side button{white-space:nowrap;flex:none}
  #side hr{display:none}
  .fields{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login">
  <div class="lbox" id="loginForm">
    <h1>Portfolio admin</h1>
    <p>Enter the admin password to edit your website.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn" type="button">Log in</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>Portfolio admin</h1>
    <span class="status" id="status"></span>
    <a class="btn line" href="/" target="_blank" rel="noopener">View site</a>
    <button class="btn gold" id="saveBtn" type="button">Save and publish</button>
    <button class="btn line" id="logoutBtn" type="button">Log out</button>
  </header>
  <div class="layout">
    <nav id="side" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/admin/admin.b429de05.js" defer></script>
</body>
</html>
