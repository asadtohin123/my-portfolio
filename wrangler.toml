name = "my-portfolio"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The website files (public/ folder) are served free and unlimited.
[assets]
directory = "./public"
binding = "ASSETS"

# The database. After running "wrangler d1 create portfolio-db",
# paste the database_id it prints in place of the text below.
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "7547c63e-aef2-4fa6-bdb7-0c5cead364d1"
